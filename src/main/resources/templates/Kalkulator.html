<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kalkulator Aritmatika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ocean-deep: #073b5c;
            --ocean-blue: #087eae;
            --ocean-cyan: #20b8c5;
            --ocean-foam: #e7f7f8;
            --ocean-ink: #12364a;
        }

        body {
            min-height: 100vh;
            color: var(--ocean-ink);
            background:
                radial-gradient(ellipse at 12% 8%, rgba(32, 184, 197, .2), transparent 34rem),
                radial-gradient(ellipse at 90% 86%, rgba(8, 126, 174, .18), transparent 36rem),
                linear-gradient(145deg, #f3fcfd 0%, #e5f5f8 48%, #d9edf4 100%);
        }

        .page-shell {
            max-width: 900px;
        }

        .ocean-banner {
            position: relative;
            isolation: isolate;
            min-height: 235px;
            margin-bottom: 1.5rem;
            padding: 2rem 2.25rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 8px;
            background:
                linear-gradient(90deg, rgba(3, 43, 74, .91) 0%, rgba(4, 91, 126, .78) 52%, rgba(11, 140, 166, .35) 100%),
                url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1600&q=85') center 52% / cover;
            box-shadow: 0 18px 38px rgba(7, 59, 92, .2);
        }

        .ocean-banner::after {
            position: absolute;
            z-index: -1;
            right: -5%;
            bottom: -42px;
            left: -5%;
            height: 68px;
            border-radius: 50% 50% 0 0 / 55% 55% 0 0;
            background: rgba(130, 229, 224, .44);
            content: "";
            transform: rotate(-2deg);
        }

        .banner-copy {
            position: relative;
            z-index: 1;
            max-width: 55%;
            color: #fff;
        }

        .banner-kicker {
            margin-bottom: .45rem;
            color: #a4f0e8;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .page-title {
            margin-bottom: .45rem;
            color: #fff;
            font-size: 2rem;
            font-weight: 750;
            letter-spacing: 0;
        }

        .page-subtitle {
            margin-bottom: 0;
            color: rgba(237, 252, 255, .88);
        }

        .ocean-life {
            position: absolute;
            right: 1.5rem;
            bottom: 1.45rem;
            display: flex;
            align-items: flex-end;
            gap: .45rem;
            color: #fff;
            font-size: 2rem;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(0, 29, 52, .35));
        }

        .ocean-life span:nth-child(2),
        .ocean-life span:nth-child(4) {
            padding-bottom: 1.05rem;
            font-size: 1.55rem;
        }

        .ocean-card {
            overflow: hidden;
            border: 1px solid rgba(8, 126, 174, .14);
            border-radius: 8px;
            background: rgba(255, 255, 255, .94);
            box-shadow: 0 12px 30px rgba(7, 59, 92, .09) !important;
        }

        .ocean-header {
            border: 0;
            background: linear-gradient(100deg, var(--ocean-deep), var(--ocean-blue));
            color: #fff;
        }

        .ocean-history-header {
            background: linear-gradient(100deg, #07546d, #087eae);
        }

        .history-frame {
            position: relative;
            padding: 0 1.15rem;
        }

        .history-stars {
            position: absolute;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            color: #168ba9;
            font-size: .78rem;
            line-height: 1;
            opacity: .8;
            pointer-events: none;
        }

        .history-stars-left {
            left: 0;
        }

        .history-stars-right {
            right: 0;
        }

        .form-label {
            color: #28566d;
        }

        .form-control,
        .form-select {
            border-color: #c3dce5;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--ocean-cyan);
            box-shadow: 0 0 0 .2rem rgba(32, 184, 197, .18);
        }

        .btn-calculate {
            border-color: var(--ocean-cyan);
            background: linear-gradient(145deg, #12a9bd, #087eae);
            color: #fff;
        }

        .btn-calculate:hover {
            border-color: var(--ocean-deep);
            background: var(--ocean-deep);
            color: #fff;
        }

        .table-ocean {
            --bs-table-bg: var(--ocean-foam);
            --bs-table-color: var(--ocean-deep);
            --bs-table-border-color: #c9e2e8;
        }

        .table-hover tbody tr:hover > * {
            --bs-table-bg-state: #e7f7f8;
        }

        .btn-edit {
            border-color: #83d6d5;
            background: #d7f4f1;
            color: #075b69;
        }

        .btn-edit:hover {
            border-color: #20b8c5;
            background: #20b8c5;
            color: #073b5c;
        }

        .cancel-edit {
            color: var(--ocean-blue);
        }

        @media (max-width: 575.98px) {
            .page-shell {
                padding-top: 1.5rem !important;
            }

            .ocean-banner {
                min-height: 270px;
                padding: 1.5rem;
                background-position: 58% center;
            }

            .banner-copy {
                max-width: 100%;
            }

            .page-title {
                max-width: 250px;
                font-size: 1.7rem;
            }

            .ocean-life {
                right: 1rem;
                bottom: 1rem;
                gap: .25rem;
                font-size: 1.55rem;
            }

            .ocean-life span:nth-child(2),
            .ocean-life span:nth-child(4) {
                font-size: 1.25rem;
            }

            .history-frame {
                padding: 0 .95rem;
            }

            .history-stars {
                font-size: .65rem;
            }
        }
    </style>
</head>
<body>
<div class="container page-shell py-4">

    <header class="ocean-banner">
        <div class="banner-copy">
            <p class="banner-kicker">Petualangan bawah laut</p>
            <h1 class="page-title">Kalkulator Aritmatika</h1>
            <p class="page-subtitle">Hitung sambil menyelam ke dunia laut. -by nayla n hilan</p>
        </div>
        <div class="ocean-life" aria-hidden="true">
            <span>🐠</span><span>🪸</span><span>🐚</span><span>⭐</span><span>🐙</span>
        </div>
    </header>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${sukses}" class="alert alert-success" th:text="${sukses}"></div>

    <!-- FORM -->
    <div class="card ocean-card mb-4">
        <div class="card-header ocean-header fw-semibold"
             th:text="${editId != null} ? ('Edit Operasi #' + ${editId}) : 'Form Operasi Aritmatika'">
            Form Operasi Aritmatika
        </div>
        <div class="card-body">
            <form th:action="@{/kalkulator/hitung}" method="post" class="row g-2 align-items-end">
                <input type="hidden" name="id" th:if="${editId != null}" th:value="${editId}">

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Bilangan 1</label>
                    <input type="number" step="any" name="bil1" class="form-control"
                           th:value="${bil1}" placeholder="Masukkan angka" required>
                </div>

                <div class="col-md-2">
                    <label class="form-label fw-semibold">Operator</label>
                    <select name="op" class="form-select">
                        <option value="+" th:selected="${op == '+'}">+</option>
                        <option value="-" th:selected="${op == '-'}">-</option>
                        <option value="x" th:selected="${op == 'x'}">x</option>
                        <option value="/" th:selected="${op == '/'}">/</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Bilangan 2</label>
                    <input type="number" step="any" name="bil2" class="form-control"
                           th:value="${bil2}" placeholder="Masukkan angka" required>
                </div>

                <div class="col-md-1">
                    <button type="submit" class="btn btn-calculate w-100 fw-bold">=</button>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Hasil</label>
                    <input type="text" class="form-control bg-white" th:value="${hasil}" readonly>
                </div>
            </form>

            <a th:if="${editId != null}" th:href="@{/kalkulator}" class="btn btn-link cancel-edit px-0 mt-2">Batal edit</a>
        </div>
    </div>

    <!-- TABEL -->
    <div class="card ocean-card">
        <div class="card-header ocean-header ocean-history-header fw-semibold">Riwayat Operasi</div>
        <div class="card-body">
            <div class="history-frame">
                <div class="history-stars history-stars-left" aria-hidden="true">
                    <span>✦</span><span>⋆</span><span>✧</span><span>⋆</span><span>✦</span>
                </div>
                <div class="history-stars history-stars-right" aria-hidden="true">
                    <span>✦</span><span>⋆</span><span>✧</span><span>⋆</span><span>✦</span>
                </div>
                <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle text-center mb-0">
                    <thead class="table-ocean">
                    <tr>
                        <th>Bilangan 1</th>
                        <th>Operator</th>
                        <th>Bilangan 2</th>
                        <th>=</th>
                        <th>Hasil</th>
                        <th>Aksi</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="k : ${daftar}"
                        th:classappend="${editId != null and editId == k.id} ? 'table-warning'">
                        <td th:text="${k.bil1Tampil}"></td>
                        <td th:text="${k.operator}"></td>
                        <td th:text="${k.bil2Tampil}"></td>
                        <td>=</td>
                        <td th:text="${k.hasilTampil}"></td>
                        <td>
                            <a class="btn btn-edit btn-sm" th:href="@{/kalkulator(edit=${k.id})}">Edit</a>
                            <form th:action="@{/kalkulator/hapus/{id}(id=${k.id})}" method="post"
                                  class="d-inline" onsubmit="return confirm('Hapus data ini?')">
                                <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(daftar)}">
                        <td colspan="6" class="text-muted">Belum ada data.</td>
                    </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
